<!DOCTYPE html>
<html lang="th">
  <head>
    <!-- ===== Meta & Styles ===== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Space Love Story - เรื่องราวความรักในอวกาศลึกลับ" />
    <title>Space Love Story | ความรักของเราในอวกาศ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚀</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===== Background: ดาวระยิบระยับ + เนบิวลา (สร้างดาวแบบ dynamic ใน app.js) ===== -->
    <div class="stars-bg" id="starsBg" aria-hidden="true"></div>
    <div class="nebula" aria-hidden="true"></div>

    <!-- ===== Section 1: Hero — หน้าแรก + อัปโหลดรูป ===== -->
    <section class="hero" id="hero">
      <div class="hero-content">
        <!-- หัวข้อ -->
        <div class="hero-text">
          <h1 class="hero-title">
            <span class="title-glow">🚀 Space Love Story 💫</span>
          </h1>
          <p class="hero-subtitle">ความรักของเรากว้างใหญ่เท่าจักรวาล...</p>
        </div>

        <div class="upload-section" id="uploadSection">
          <!-- ปุ่มเลือกรูปภาพ -->
          <div class="upload-container">
            <label for="photoInput" class="upload-btn" id="uploadBtn">
              <span class="upload-icon">📸</span>
              <span class="upload-text">เลือกรูปภาพคู่ของเรา</span>
              <span class="upload-hint">เลือกได้หลายรูป</span>
            </label>
            <input type="file" id="photoInput" accept="image/*" multiple hidden />
          </div>

          <!-- ตัวอย่างรูป + จำนวนรูปที่จะโชว์ + ปุ่มสตาร์ท -->
          <div class="preview-section" id="previewSection" hidden>
            <h3 class="preview-title">
              📷 รูปภาพที่เลือก (<span id="photoCount">0</span> รูป)
            </h3>
            <div class="thumbnails-container" id="thumbnailsContainer"></div>

            <div class="photo-count-section">
              <label for="displayCount" class="count-label">จำนวนรูปภาพที่ต้องการโชว์:</label>
              <input type="number" id="displayCount" class="count-input" min="1" value="5" />
            </div>

            <button class="start-btn" id="startBtn">
              <span class="btn-text">✨ สตาร์ทการเดินทางอวกาศของเรา</span>
              <span class="btn-icon">🚀💕🌌</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Overlay: Black Hole Warp Transition ===== -->
    <div class="warp-overlay" id="warpOverlay" aria-hidden="true">
      <!-- หลุมดำกลางจอ (แกนดำ + วงแหวนฝุ่นร้อบหมุนรอบ) -->
      <div class="black-hole">
        <div class="black-hole-accretion"></div>
        <div class="black-hole-core"></div>
      </div>

      <!-- จรวดหมุนเกลียวถูกดูดเข้าหลุมดำ (orbit หมุนรอบ + spiral หดรัศมี) -->
      <div class="warp-rocket-orbit">
        <div class="warp-rocket">🚀</div>
      </div>

      <div class="warp-text">กำลังดึงดูดเข้าสู่หลุมดำ...</div>
    </div>

    <!-- แสงวาร์ปวาบ (Warp Flash) — แสดงตอนจรวดถึงจุดศูนย์กลางหลุมดำ -->
    <div class="warp-flash" id="warpFlash" aria-hidden="true"></div>

    <!-- ===== Section 2: Timeline — โชว์รูปภาพความทรงจำ ===== -->
    <section class="timeline-section" id="timelineSection" hidden>
      <div class="timeline" id="timeline">
        <!-- Timeline items จะถูกสร้างแบบ dynamic ด้วย JavaScript -->
      </div>
    </section>

    <!-- ===== App ===== -->
    <script src="app.js"></script>
  </body>
</html>
